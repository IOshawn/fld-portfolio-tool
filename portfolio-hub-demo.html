<style>
:root {
  color-scheme: light;
  --bg: #f3f4f6;
  --surface: #ffffff;
  --surface-2: #f7f8fa;
  --surface-3: #eef0f3;
  --stroke: #e3e5e9;
  --stroke-2: #eceef1;
  --text: #1f2329;
  --text-2: #4a4f57;
  --text-3: #767b84;
  --brand: #0f6cbd;
  --brand-2: #eaf2fb;
  --brand-ink: #0b5394;
  --shadow: 0 1px 2px rgba(20, 30, 50, .06), 0 2px 8px rgba(20, 30, 50, .05);
  --shadow-lg: 0 6px 20px rgba(20, 30, 50, .12);
  --radius: 12px;
  --font: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}
@media (prefers-color-scheme: dark) {
  /* Demo is designed light; provide a graceful dark fallback for dark-OS viewers. */
  :root {
    --bg: #1b1d21; --surface: #24272c; --surface-2: #2a2e34; --surface-3: #30343b;
    --stroke: #3a3f47; --stroke-2: #343941; --text: #f2f3f5; --text-2: #c8ccd2;
    --text-3: #9aa0a8; --brand-2: #1e3a52;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  font-size: 14px;
  line-height: 1.45;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; }

/* ----- App shell ----- */
.app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
.aside {
  background: var(--surface); border-inline-end: 1px solid var(--stroke);
  position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column;
}
.brand { padding: 20px 20px 16px; border-bottom: 1px solid var(--stroke); display: flex; gap: 10px; align-items: center; }
.brand-mark {
  width: 32px; height: 32px; border-radius: 8px; background: var(--brand); color: #fff;
  display: grid; place-items: center; font-weight: 700; font-size: 14px; flex-shrink: 0;
}
.brand-title { font-weight: 600; font-size: 14px; }
.brand-sub { font-size: 12px; color: var(--text-3); }
.nav { padding: 12px; display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 8px;
  color: var(--text-2); font-weight: 500; cursor: pointer; white-space: nowrap;
}
.nav-item:hover { background: var(--surface-3); color: var(--text); }
.nav-item.active { background: var(--brand-2); color: var(--brand-ink); font-weight: 600; }
.nav-item svg { width: 20px; height: 20px; flex-shrink: 0; }
.aside-foot { margin-top: auto; padding: 16px 20px; border-top: 1px solid var(--stroke); }
.pill-demo { display: inline-block; font-size: 12px; color: var(--brand-ink); background: var(--brand-2); padding: 3px 10px; border-radius: 999px; }

.main { min-width: 0; overflow: auto; }
.content { max-width: 1240px; margin: 0 auto; padding: 28px 32px 64px; }

/* ----- Page header ----- */
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--brand-ink); }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
.page-title { font-size: 28px; font-weight: 700; line-height: 1.1; margin: 4px 0 2px; }
.page-sub { color: var(--text-3); }
.rule { height: 1px; background: var(--stroke); margin: 16px 0 24px; }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ----- Buttons ----- */
.btn {
  border: 1px solid var(--stroke); background: var(--surface); color: var(--text);
  padding: 7px 14px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { background: #0c5aa0; }
.btn.subtle { border-color: transparent; background: transparent; color: var(--brand-ink); padding: 4px 8px; }
.btn.sm { padding: 4px 10px; font-size: 13px; }

/* ----- Cards / surfaces ----- */
.surface { background: var(--surface); border: 1px solid var(--stroke); border-radius: var(--radius); box-shadow: var(--shadow); }
.section { display: flex; flex-direction: column; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--stroke); }
.section-head .st { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 15px; }
.section-head svg { width: 18px; height: 18px; color: var(--brand-ink); }
.section-body { padding: 10px 18px 16px; }
.section-body.flush { padding: 0; }

.grid-2 { display: grid; grid-template-columns: 1.5fr 1fr; gap: 16px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
@media (max-width: 980px) { .grid-2 { grid-template-columns: 1fr; } }

.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 20px; }
.stat { padding: 16px 18px; }
.stat .accent { height: 3px; width: 36px; border-radius: 3px; margin-bottom: 10px; }
.stat .val { font-size: 32px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .lab { color: var(--text-3); margin-top: 4px; }
.stat .hint { color: var(--text-3); font-size: 12px; }

/* ----- Badges / chips ----- */
.badge { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.badge.outline { background: transparent; border: 1px solid var(--stroke); color: var(--text-2); }
.badge.tint { background: var(--brand-2); color: var(--brand-ink); }
.chip { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 10px; font-size: 12px; font-weight: 700; color: #fff; white-space: nowrap; }
.chip.sm { height: 19px; padding: 0 6px; border-radius: 5px; font-size: 11px; }

/* ----- Lists ----- */
.row { display: flex; align-items: center; gap: 12px; padding: 11px 4px; border-bottom: 1px solid var(--stroke-2); }
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--surface-2); }
.row.click { cursor: pointer; }
.row .ico { width: 30px; height: 30px; border-radius: 8px; background: var(--surface-3); color: var(--text-3); display: grid; place-items: center; flex-shrink: 0; }
.row .ico svg { width: 16px; height: 16px; }
.row .bd { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 1px; }
.row .pri { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .sec { color: var(--text-3); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .rt { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
.row .dt { font-variant-numeric: tabular-nums; color: var(--text-2); font-size: 13px; white-space: nowrap; }
.muted { color: var(--text-3); padding: 12px 4px; }
.bodypad { padding: 0 20px 8px; }

/* ----- Bars ----- */
.bars { display: flex; flex-direction: column; gap: 12px; padding: 8px 0; }
.bar-row { display: grid; grid-template-columns: 120px 1fr 28px; align-items: center; gap: 12px; }
.bar-lab { color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-track { height: 10px; background: var(--surface-3); border-radius: 6px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 6px; min-width: 2px; }
.bar-num { text-align: end; font-variant-numeric: tabular-nums; font-weight: 600; }

/* ----- Filters ----- */
.filters { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 12px; font-weight: 600; color: var(--text-2); }
.field select, .field input, .form input, .form select, .form textarea {
  font-family: inherit; font-size: 14px; padding: 7px 10px; border: 1px solid var(--stroke); border-radius: 6px;
  background: var(--surface); color: var(--text); min-width: 150px;
}
.field input { min-width: 220px; }
.count { color: var(--text-3); font-size: 13px; padding-bottom: 6px; }
.spacer { flex: 1; }

/* ----- Roadmap timeline ----- */
.tl-scroll { overflow: auto; }
.tl { min-width: 960px; }
.tl-head { display: grid; grid-template-columns: 184px 1fr; position: sticky; top: 0; z-index: 3; background: var(--surface); border-bottom: 1px solid var(--stroke); }
.tl-head .lab { position: sticky; inset-inline-start: 0; z-index: 4; background: var(--surface); padding: 12px 16px; border-inline-end: 1px solid var(--stroke); color: var(--text-3); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; display: flex; align-items: flex-end; }
.tl-years { display: flex; }
.tl-year { flex: 1; border-inline-end: 1px solid var(--stroke); }
.tl-year:last-child { border-inline-end: 0; }
.tl-year .y { padding: 8px 12px 4px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tl-qs { display: flex; }
.tl-q { flex: 1; padding: 0 0 6px 12px; color: var(--text-3); font-size: 11px; }
.tl-row { display: grid; grid-template-columns: 184px 1fr; }
.tl-row:hover { background: var(--surface-2); }
.tl-row .lab { position: sticky; inset-inline-start: 0; z-index: 2; background: var(--surface); padding: 0 16px; border-inline-end: 1px solid var(--stroke); border-bottom: 1px solid var(--stroke-2); display: flex; flex-direction: column; justify-content: center; min-width: 0; }
.tl-row .lab .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-row .lab .s { color: var(--text-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-track { position: relative; height: 48px; border-bottom: 1px solid var(--stroke-2);
  background-image: repeating-linear-gradient(to right, var(--stroke-2) 0 1px, transparent 1px calc(100%/12)), repeating-linear-gradient(to right, var(--stroke) 0 1px, transparent 1px calc(100%/3)); }
.tl-bar { position: absolute; top: 11px; height: 26px; border-radius: 6px; display: flex; align-items: center; padding: 0 8px; overflow: hidden; color: #fff; box-shadow: var(--shadow); cursor: pointer; }
.tl-bar:hover { box-shadow: var(--shadow-lg); transform: translateY(-1px); }
.tl-bar span { font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--brand); z-index: 1; }
.legend { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-top: 14px; color: var(--text-3); }
.legend .it { display: flex; align-items: center; gap: 6px; }
.legend .sw { width: 12px; height: 12px; border-radius: 3px; }

/* ----- Project cards ----- */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; align-items: start; }
.pcard { padding: 16px 18px; cursor: pointer; display: flex; flex-direction: column; gap: 12px; }
.pcard:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
.pcard .top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.pcard .nm { font-weight: 600; font-size: 15px; line-height: 1.2; }
.pcard .cd { color: var(--text-3); font-size: 12px; font-variant-numeric: tabular-nums; }
.pcard .ch { display: flex; gap: 8px; flex-wrap: wrap; }
.pcard .ow { display: flex; align-items: center; gap: 8px; color: var(--text-2); font-size: 13px; }
.pcard .nx { display: flex; gap: 8px; align-items: center; padding-top: 10px; border-top: 1px solid var(--stroke-2); color: var(--text-3); font-size: 12px; }
.avatar { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 700; flex-shrink: 0; }

/* ----- Tabs ----- */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--stroke); margin-bottom: 16px; }
.tab { padding: 9px 14px; cursor: pointer; font-weight: 600; color: var(--text-3); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--brand-ink); border-bottom-color: var(--brand); }

/* ----- Detail ----- */
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--text-3); margin-bottom: 12px; cursor: pointer; }
.back:hover { color: var(--text); }
.callout { padding: 12px 14px; border-radius: 8px; background: var(--surface-2); border-inline-start: 3px solid var(--brand); margin-bottom: 12px; }
.callout.value { border-inline-start-color: #2f9e8f; }
.callout .k { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; margin-top: 14px; }
.fact .k { color: var(--text-3); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
.fact .v { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
.dep { margin-top: 16px; }
.dep .k { color: var(--text-3); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; display: flex; align-items: center; gap: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.progress { height: 10px; background: var(--surface-3); border-radius: 6px; overflow: hidden; }
.progress > div { height: 100%; background: var(--brand); }

/* ----- Matrix / heatmap ----- */
.mx-scroll { overflow: auto; }
.mx { display: grid; min-width: 880px; grid-template-columns: 184px repeat(12, minmax(62px, 1fr)); }
.mx .corner { position: sticky; top: 0; inset-inline-start: 0; z-index: 5; background: var(--surface); border-inline-end: 1px solid var(--stroke); border-bottom: 1px solid var(--stroke); padding: 10px 12px; color: var(--text-3); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; display: flex; align-items: flex-end; }
.mx .ch { position: sticky; top: 0; z-index: 3; background: var(--surface); border-bottom: 1px solid var(--stroke); border-inline-end: 1px solid var(--stroke-2); padding: 8px 6px; text-align: center; font-weight: 600; font-size: 12px; cursor: pointer; }
.mx .ch:hover { background: var(--surface-2); }
.mx .rh { position: sticky; inset-inline-start: 0; z-index: 2; background: var(--surface); border-inline-end: 1px solid var(--stroke); border-bottom: 1px solid var(--stroke-2); padding: 8px 12px; font-weight: 600; font-size: 13px; display: flex; align-items: center; }
.mx .cell { border-inline-end: 1px solid var(--stroke-2); border-bottom: 1px solid var(--stroke-2); padding: 5px; min-height: 44px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 3px; }
.mx .cell a { cursor: pointer; }
.mx .hcell { border-inline-end: 1px solid var(--stroke-2); border-bottom: 1px solid var(--stroke-2); min-height: 44px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 13px; cursor: pointer; }
.mx .hcell.sel { outline: 2px solid var(--brand); outline-offset: -2px; }
.drill { margin-top: 16px; padding: 16px 18px; }
.tip { color: var(--text-3); font-size: 13px; margin-top: 12px; }

/* ----- Site view ----- */
.grid-site { display: grid; grid-template-columns: 240px 1fr; gap: 16px; align-items: start; }
@media (max-width: 880px) { .grid-site { grid-template-columns: 1fr; } }
.site-btn { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 8px; border: 0; background: transparent; color: var(--text); cursor: pointer; text-align: start; width: 100%; }
.site-btn:hover { background: var(--surface-3); }
.site-btn.active { background: var(--brand-2); color: var(--brand-ink); }
.site-btn .nm { font-weight: 600; }
.site-btn .sub { font-size: 11px; color: var(--text-3); }
.site-pill { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--text-3); background: var(--surface-3); padding: 1px 8px; border-radius: 10px; flex-shrink: 0; }

/* ----- Forms ----- */
.form { display: flex; flex-direction: column; gap: 16px; max-width: 720px; }
.form .field { gap: 5px; }
.form .field label { color: var(--text-2); }
.form textarea { min-height: 70px; resize: vertical; width: 100%; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 560px) { .row2 { grid-template-columns: 1fr; } }
.success { display: flex; gap: 12px; align-items: flex-start; padding: 16px 18px; border-radius: 10px; background: #e7f5ea; border: 1px solid #a7d8b3; }
.success svg { color: #0e700e; flex-shrink: 0; }

.print-note { display: none; }
@media print { .aside { display: none; } .app { grid-template-columns: 1fr; } }

</style>
</head>

<script>
"use strict";
/* Frontline Digital Portfolio Hub — clickable static walkthrough.
   Vanilla JS, event-delegated (no inline handlers). Data is embedded above as DATA. */

// ----------------------------- constants -----------------------------
var SITES = ["MDO","WAN","YAN","GDI","GTP","BM4","GNAM","HD1","HD4","PBO","RV","PMO Control"];
var SITE_NAMES = {MDO:"Mesa A",WAN:"West Angelas",YAN:"Yandicoogina",GDI:"Gudai-Darri",GTP:"Greater Tom Price",BM4:"Brockman 4",GNAM:"Greater Nammuldi",HD1:"Hope Downs 1",HD4:"Hope Downs 4",PBO:"Paraburdoo",RV:"Robe Valley","PMO Control":"PMO / Control"};
var WORK_AREAS = ["OE/BI","Production","Drill & Blast","Development","Mine Water Management","MEM","Fixed Plant"];
var ENG_STAGES = ["Discovery","Design","Development","Prototype","Readiness","Pilot","Engaged","Scale"];
var STAGE_COLORS = {Discovery:"#8c94a3",Design:"#5f76b5",Development:"#4566bf",Prototype:"#5a8fb0",Readiness:"#c2902a",Pilot:"#2f9e8f",Engaged:"#3d8a4f",Scale:"#2f6b3e"};
var STATUS_BAR = {Green:"#3d8a4f",Amber:"#c08a1e",Red:"#bc3b3b","On Hold":"#5b6b8c",Complete:"#5a6470"};
var STATUSES = ["Green","Amber","Red","On Hold","Complete"];
var MILE_COLOR = {Complete:"#5a6470","On Track":"#3d8a4f",Planned:"#5f76b5","At Risk":"#c08a1e",Delayed:"#bc3b3b"};
var ENG_STATUS = ["Planned","Active","On Hold","Complete"];
var ENG_STATUS_COLOR = {Active:"#3d8a4f",Planned:"#5f76b5","On Hold":"#c08a1e",Complete:"#5a6470"};
var STAGE_ORDER = {Idea:0,Discovery:1,Design:2,Build:3,Pilot:4,Scale:5,Sustain:6,Complete:7};
var TODAY = new Date(2026,5,25); // app "today" matches the sample data

// ----------------------------- helpers -----------------------------
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function parseISO(s){var p=String(s).split("-");return new Date(+p[0],(+p[1]||1)-1,+p[2]||1);}
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDate(s){if(!s)return "—";var d=parseISO(s);return d.getDate()+" "+MON[d.getMonth()]+" "+d.getFullYear();}
function todayISO(){var m=String(TODAY.getMonth()+1).padStart(2,"0"),d=String(TODAY.getDate()).padStart(2,"0");return TODAY.getFullYear()+"-"+m+"-"+d;}
function days(s){return Math.round((parseISO(s)-TODAY)/86400000);}
function relDay(s){var d=days(s);if(d===0)return"today";if(d===1)return"tomorrow";if(d===-1)return"yesterday";return d>0?("in "+d+" days"):(Math.abs(d)+" days ago");}
function initials(n){return String(n).split(/\s+/).filter(Boolean).slice(0,2).map(function(x){return x[0].toUpperCase();}).join("");}
var AV=["#0f6cbd","#3d8a4f","#8a5cb5","#bc6a2e","#2f9e8f","#b3477a","#5f76b5","#a23b3b"];
function avColor(n){var h=0;for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))>>>0;return AV[h%AV.length];}
function avatar(n,sz){sz=sz||24;return '<span class="avatar" style="width:'+sz+'px;height:'+sz+'px;background:'+avColor(n)+'">'+esc(initials(n))+'</span>';}

// minimal inline-SVG icon set
var P={
 home:'<path d="M4 11.5 12 5l8 6.5M6 10.5V19h12v-8.5"/>',
 roadmap:'<path d="M4 7h16M4 12h16M4 17h16"/><circle cx="8" cy="7" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="10" cy="17" r="1.4"/>',
 projects:'<rect x="4" y="4" width="7" height="7" rx="1.2"/><rect x="13" y="4" width="7" height="7" rx="1.2"/><rect x="4" y="13" width="7" height="7" rx="1.2"/><rect x="13" y="13" width="7" height="7" rx="1.2"/>',
 engagements:'<circle cx="6" cy="6" r="2.2"/><circle cx="18" cy="6" r="2.2"/><circle cx="12" cy="18" r="2.2"/><path d="M7.6 7.4 10.6 16M16.4 7.4 13.4 16M8 6h8"/>',
 sites:'<path d="M12 21s6-5.3 6-10a6 6 0 1 0-12 0c0 4.7 6 10 6 10Z"/><circle cx="12" cy="11" r="2.2"/>',
 updates:'<path d="M5 19h14M7 15.5 16 6.5l2 2-9 9-2.6.6.6-2.6Z"/>',
 flag:'<path d="M6 21V4m0 1h11l-2 3.5L17 12H6"/>',
 location:'<path d="M12 21s6-5.3 6-10a6 6 0 1 0-12 0c0 4.7 6 10 6 10Z"/><circle cx="12" cy="11" r="2.2"/>',
 calendar:'<rect x="4" y="5.5" width="16" height="14" rx="1.6"/><path d="M4 9.5h16M8 4v3M16 4v3"/>',
 clock:'<circle cx="12" cy="12" r="8"/><path d="M12 8v4.2l2.6 1.6"/>',
 check:'<circle cx="12" cy="12" r="8"/><path d="m8.5 12 2.3 2.3 4.7-4.7"/>',
 warning:'<path d="M12 4 21 19H3L12 4Z"/><path d="M12 10v4M12 16.5v.5"/>',
 grid:'<rect x="3.5" y="3.5" width="17" height="17" rx="1.6"/><path d="M3.5 9.5h17M3.5 15h17M9.5 3.5v17M15 3.5v17"/>',
 team:'<circle cx="9" cy="9" r="2.8"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M16 7.2a2.6 2.6 0 0 1 0 5M17 14.2a5 5 0 0 1 3.5 4.8"/>',
 link:'<path d="M9.5 14.5 14.5 9.5"/><path d="M11 7.5 12.5 6a3.2 3.2 0 0 1 4.5 4.5l-1.5 1.5"/><path d="M13 16.5 11.5 18A3.2 3.2 0 0 1 7 13.5L8.5 12"/>',
 search:'<circle cx="11" cy="11" r="6"/><path d="m20 20-3.2-3.2"/>',
 filter:'<path d="M4 6h16l-6 7v5l-4 1.5V13L4 6Z"/>',
 person:'<circle cx="12" cy="8" r="3.4"/><path d="M5.5 19.5a6.5 6.5 0 0 1 13 0"/>'
};
function ic(n,sz){sz=sz||20;return '<svg viewBox="0 0 24 24" width="'+sz+'" height="'+sz+'" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(P[n]||"")+'</svg>';}

// badges
function statusBadge(s){return '<span class="chip" style="background:'+(STATUS_BAR[s]||"#777")+'">'+esc(s)+'</span>';}
function stageChip(s,sm){return '<span class="chip'+(sm?" sm":"")+'" style="background:'+(STAGE_COLORS[s]||"#777")+'">'+esc(s)+'</span>';}
function mileBadge(s){return '<span class="chip sm" style="background:'+(MILE_COLOR[s]||"#777")+'">'+esc(s)+'</span>';}
function engStatusBadge(s){return '<span class="badge outline" style="border-color:'+(ENG_STATUS_COLOR[s]||"#aaa")+';color:'+(ENG_STATUS_COLOR[s]||"#555")+'">'+esc(s)+'</span>';}
function stageBadgeProj(s){return '<span class="badge outline">'+esc(s)+'</span>';}

// ----------------------------- selectors -----------------------------
function projById(id){return DATA.projects.filter(function(p){return p.id===id;})[0];}
function titleOf(id){var p=projById(id);return p?p.title:id;}
function engForInit(id){return DATA.engagements.filter(function(e){return e.initiativeId===id;}).sort(byStart);}
function engForSite(s){return DATA.engagements.filter(function(e){return e.site===s;}).sort(byStart);}
function byStart(a,b){return parseISO(a.startDate)-parseISO(b.startDate);}
function activeSites(es){var set={};es.forEach(function(e){set[e.site]=1;});return SITES.filter(function(s){return set[s];});}
function activeWAs(es){var set={};es.forEach(function(e){set[e.workArea]=1;});return WORK_AREAS.filter(function(w){return set[w];});}
function sitesForInit(id){var set={};DATA.engagements.forEach(function(e){if(e.initiativeId===id)set[e.site]=1;});return SITES.filter(function(s){return set[s];});}
function wasForInit(id){var set={};DATA.engagements.forEach(function(e){if(e.initiativeId===id)set[e.workArea]=1;});return WORK_AREAS.filter(function(w){return set[w];});}
function furthest(es){if(!es.length)return null;return es.slice().sort(function(a,b){return ENG_STAGES.indexOf(b.stage)-ENG_STAGES.indexOf(a.stage);})[0].stage;}
function nextMile(id){var open=DATA.milestones.filter(function(m){return m.projectId===id&&m.status!=="Complete";}).sort(function(a,b){return parseISO(a.date)-parseISO(b.date);});var up=open.filter(function(m){return parseISO(m.date)>=TODAY;});return up[0]||open[0];}
function upMiles(n){return DATA.milestones.filter(function(m){return m.status!=="Complete"&&parseISO(m.date)>=TODAY;}).sort(function(a,b){return parseISO(a.date)-parseISO(b.date);}).slice(0,n);}
function upEng(n){return DATA.engagements.filter(function(e){return parseISO(e.startDate)>=TODAY&&e.status!=="Complete";}).sort(byStart).slice(0,n);}
function attention(){var onhold={};DATA.engagements.forEach(function(e){if(e.status==="On Hold")onhold[e.initiativeId]=1;});var sev={Red:0,Amber:1,"On Hold":2};return DATA.projects.filter(function(p){return p.status==="Red"||p.status==="Amber"||onhold[p.id];}).sort(function(a,b){return (sev[a.status]==null?9:sev[a.status])-(sev[b.status]==null?9:sev[b.status]);});}
function recently(n){return DATA.projects.slice().sort(function(a,b){return parseISO(b.lastUpdated)-parseISO(a.lastUpdated);}).slice(0,n);}
function sitesByActivity(){return activeSites(DATA.engagements).map(function(s){var at=DATA.engagements.filter(function(e){return e.site===s;});var inits={};at.forEach(function(e){inits[e.initiativeId]=1;});return{site:s,engagements:at.length,initiatives:Object.keys(inits).length};}).sort(function(a,b){return b.engagements-a.engagements||b.initiatives-a.initiatives;});}
function cellKey(w,s){return w+"||"+s;}
function buildMatrix(es){var m={};es.forEach(function(e){var k=cellKey(e.workArea,e.site);(m[k]=m[k]||[]).push(e);});return m;}
function applyEngFilters(f){return DATA.engagements.filter(function(e){return (!f.initiativeId||e.initiativeId===f.initiativeId)&&(!f.site||e.site===f.site)&&(!f.portfolio||e.portfolio===f.portfolio)&&(!f.workArea||e.workArea===f.workArea)&&(!f.status||e.status===f.status)&&(!f.stage||e.stage===f.stage);});}

// ----------------------------- state -----------------------------
var state={
 view:"home", projectId:null, detailTab:"milestones",
 rm:{portfolio:"",site:"",workArea:"",stage:""},
 pf:{q:"",portfolio:"",stage:"",status:""},
 eng:{initiativeId:"",site:"",portfolio:"",workArea:"",status:"",stage:""},
 engTab:"matrix", heatSel:"",
 site:SITES[0], updTab:"project", flash:""
};

// ----------------------------- shared UI -----------------------------
function pageHead(eyebrow,title,sub,actions){
 return '<div class="page-head"><div><div class="eyebrow">'+esc(eyebrow)+'</div><h1 class="page-title">'+esc(title)+'</h1><div class="page-sub">'+esc(sub)+'</div></div>'+(actions?'<div class="head-actions">'+actions+'</div>':"")+'</div><div class="rule"></div>';
}
function section(title,icon,body,flush,action){
 return '<section class="surface section"><div class="section-head"><div class="st">'+(icon?ic(icon,18):"")+esc(title)+'</div>'+(action||"")+'</div><div class="section-body'+(flush?" flush":"")+'">'+body+'</div></section>';
}
function stat(lab,val,hint,accent){
 return '<div class="surface stat">'+(accent?'<span class="accent" style="background:'+accent+'"></span>':"")+'<div class="val">'+esc(val)+'</div><div class="lab">'+esc(lab)+'</div>'+(hint?'<div class="hint">'+esc(hint)+'</div>':"")+'</div>';
}
function sel(filterAttr,cur,opts,allLabel){
 var o='<option value="">'+esc(allLabel)+'</option>';
 opts.forEach(function(op){var v=op.value!=null?op.value:op,l=op.label!=null?op.label:op;o+='<option value="'+esc(v)+'"'+(v===cur?" selected":"")+'>'+esc(l)+'</option>';});
 return '<div class="field"><label>'+esc(filterAttr.label)+'</label><select data-fgroup="'+filterAttr.group+'" data-fkey="'+filterAttr.key+'">'+o+'</select></div>';
}
function emptyState(icon,title,msg){return '<div class="surface" style="padding:40px;text-align:center"><div style="display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--surface-3);color:var(--text-3);margin-bottom:8px">'+ic(icon,22)+'</div><div style="font-weight:600;font-size:15px">'+esc(title)+'</div>'+(msg?'<div class="muted" style="max-width:420px;margin:6px auto 0">'+esc(msg)+'</div>':"")+'</div>';}

function mileRow(m){return '<a class="row click" data-act="project" data-id="'+m.projectId+'"><span class="ico">'+ic("flag",16)+'</span><div class="bd"><div class="pri">'+esc(m.name)+'</div><div class="sec">'+esc(titleOf(m.projectId))+'</div></div><div class="rt"><span class="dt">'+fmtDate(m.date)+'</span>'+mileBadge(m.status)+'</div></a>';}
function engRow(e,mode){var pri,sec;if(mode==="site"){pri=titleOf(e.initiativeId);sec=e.workArea+" · "+e.purpose;}else if(mode==="init"){pri=e.site+" · "+e.workArea;sec=e.purpose;}else{pri=e.site+" · "+e.workArea;sec=titleOf(e.initiativeId)+" — "+e.purpose;}
 return '<a class="row click" data-act="project" data-id="'+e.initiativeId+'"><span class="ico">'+ic("location",16)+'</span><div class="bd"><div class="pri">'+esc(pri)+'</div><div class="sec">'+esc(sec)+'</div></div><div class="rt">'+stageChip(e.stage,true)+'<span class="dt">'+fmtDate(e.startDate)+' · '+esc(e.status)+'</span></div></a>';}
function projMini(p){return '<a class="row click" data-act="project" data-id="'+p.id+'"><div class="bd"><div class="pri">'+esc(p.title)+'</div><div class="sec">'+esc(p.owner)+' · updated '+relDay(p.lastUpdated)+'</div></div><div class="rt">'+statusBadge(p.status)+'</div></a>';}

// ----------------------------- timeline -----------------------------
var D0=new Date(2026,0,1).getTime(), D1=new Date(2029,0,1).getTime(), SPAN=D1-D0;
function frac(ms){return Math.max(0,Math.min(1,(ms-D0)/SPAN));}
function timeline(projects){
 var years=[2026,2027,2028], qs=["Q1","Q2","Q3","Q4"];
 var head='<div class="tl-head"><div class="lab">Initiative</div><div class="tl-years">'+years.map(function(y){return '<div class="tl-year"><div class="y">'+y+'</div><div class="tl-qs">'+qs.map(function(q){return '<div class="tl-q">'+q+'</div>';}).join("")+'</div></div>';}).join("")+'</div></div>';
 var tf=frac(TODAY.getTime()), tline='<div class="tl-today" style="left:'+(tf*100)+'%"></div>';
 var rows=projects.map(function(p){
   var l=frac(parseISO(p.startDate).getTime()), r=frac(parseISO(p.endDate).getTime()+86400000), w=Math.max((r-l)*100,2);
   return '<div class="tl-row"><div class="lab"><div class="t">'+esc(p.title)+'</div><div class="s">'+esc(p.portfolio)+'</div></div><div class="tl-track">'+tline+'<a class="tl-bar" data-act="project" data-id="'+p.id+'" style="left:'+(l*100)+'%;width:'+w+'%;background:'+(STATUS_BAR[p.status]||"#777")+'" title="'+esc(p.title+" · "+p.stage+" · "+fmtDate(p.startDate)+" – "+fmtDate(p.endDate))+'"><span>'+esc(p.stage)+'</span></a></div></div>';
 }).join("");
 return '<div class="surface tl-scroll"><div class="tl">'+head+rows+'</div></div>';
}
function statusLegend(){return '<div class="legend"><span style="font-weight:600;font-size:12px">Status</span>'+STATUSES.map(function(s){return '<span class="it"><span class="sw" style="background:'+STATUS_BAR[s]+'"></span>'+esc(s)+'</span>';}).join("")+'</div>';}
function stageLegend(){return '<div class="legend"><span style="font-weight:600;font-size:12px">Stage</span>'+ENG_STAGES.map(function(s){return '<span class="it"><span class="sw" style="background:'+STAGE_COLORS[s]+'"></span>'+esc(s)+'</span>';}).join("")+'</div>';}

// ----------------------------- views -----------------------------
function viewHome(){
 var inDel=DATA.projects.filter(function(p){return ["Build","Pilot","Scale"].indexOf(p.stage)>=0;}).length;
 var att=attention(), um=upMiles(6), ue=upEng(6), tops=sitesByActivity().slice(0,6);

 html+='<div style="margin-bottom:20px">'+section("Portfolio roadmap · 2026–2028","roadmap",'<div style="padding:12px">'+timeline(DATA.projects.slice().sort(byStartProj))+'</div>',true,'<button class="btn subtle sm" data-act="nav" data-view="roadmap">Open</button>')+'</div>';

 right+=section("Impacted teams & work areas","team",was.length?'<div class="chips">'+was.map(function(w){return '<span class="badge tint">'+esc(w)+' Team</span>';}).join("")+'</div>':'<div class="muted" style="padding:0">No teams engaged yet.</div>');
 right+=section("Upcoming engagements ("+up.length+")","calendar",'<div class="bodypad">'+(up.length?up.map(function(e){return engRow(e,"site");}).join(""):'<div class="muted">No upcoming engagements at this site.</div>')+'</div>',true);
 right+=section("Engagement timeline ("+se.length+")","clock",'<div class="bodypad">'+(se.length?se.map(function(e){return engRow(e,"site");}).join(""):'<div class="muted">No engagement activity.</div>')+'</div>',true);
 right+='</div>';
 html+=right+'</div>';
 return html;
}

function viewUpdates(){
 var projects=DATA.projects.slice().sort(function(a,b){return a.title.localeCompare(b.title);});
 var titles={project:"Submit a project update",milestone:"Add or update a milestone",engagement:"Log a site engagement"};
 var html=pageHead("Updates","Update the hub","Keep initiatives and engagements current — these forms write straight to the hub for you.","");
 html+='<div style="color:var(--text-3);max-width:640px;margin-bottom:16px">You never touch a list. A project update refreshes the initiative record and adds a history entry; milestones and engagements appear instantly across the roadmap, matrix and site views.</div>';
 html+='<div class="tabs">'+tabBtn("project","Project update",state.updTab,"upd")+tabBtn("milestone","Milestone",state.updTab,"upd")+tabBtn("engagement","Site engagement",state.updTab,"upd")+'</div>';
 var body;
 if(state.flash){body='<div class="success">'+ic("check",20)+'<div style="flex:1"><strong>Saved</strong><div style="color:var(--text-2)">'+esc(state.flash)+'</div></div><button class="btn" data-act="another">Post another</button></div>';}
 else if(state.updTab==="project"){body=formProject(projects);}
 else if(state.updTab==="milestone"){body=formMilestone(projects);}
 else{body=formEngagement(projects);}
 html+='<div style="max-width:720px">'+section(titles[state.updTab],"updates",body)+'</div>';
 return html;
}
function optList(arr){return arr.map(function(o){var v=o.value!=null?o.value:o,l=o.label!=null?o.label:o;return '<option value="'+esc(v)+'">'+esc(l)+'</option>';}).join("");}
function projOpts(projects){return '<option value="">Select an initiative</option>'+optList(projects.map(function(p){return{value:p.id,label:p.title};}));}
function formProject(projects){
 return '<div class="form"><div class="field"><label>Initiative *</label><select id="f_proj">'+projOpts(projects)+'</select></div>'+
 '<div class="row2"><div class="field"><label>Update date *</label><input type="date" id="f_date" value="'+todayISO()+'"></div><div class="field"><label>Submitted by *</label><input type="text" id="f_by" placeholder="Your name"></div></div>'+
 '<div class="field"><label>Update summary *</label><textarea id="f_sum" placeholder="Progress, achievements, what\'s next…"></textarea></div>'+
 '<div class="field"><label>Risks</label><textarea id="f_risk" placeholder="Any risks or blockers"></textarea></div>'+
 '<div class="field"><label>Decisions required</label><textarea id="f_dec" placeholder="Anything needing a decision"></textarea></div>'+
 '<div class="row2"><div class="field"><label>Change status (optional)</label><select id="f_status"><option value="">No change</option>'+optList(STATUSES)+'</select></div><div class="field"><label>Change stage (optional)</label><select id="f_stage"><option value="">No change</option>'+optList(Object.keys(STAGE_ORDER))+'</select></div></div>'+
 '<div><button class="btn primary" data-act="submit" data-kind="project">Save update</button></div></div>';
}
function formMilestone(projects){
 return '<div class="form"><div class="field"><label>Initiative *</label><select id="f_proj">'+projOpts(projects)+'</select></div>'+
 '<div class="field"><label>Milestone name *</label><input type="text" id="f_name" placeholder="e.g. Pilot go-live"></div>'+
 '<div class="row2"><div class="field"><label>Milestone date *</label><input type="date" id="f_date" value="'+todayISO()+'"></div><div class="field"><label>Status *</label><select id="f_status"><option value="">Select status</option>'+optList(["Planned","On Track","At Risk","Delayed","Complete"])+'</select></div></div>'+
 '<div class="field"><label>Notes</label><textarea id="f_notes" placeholder="Optional context"></textarea></div>'+
 '<div><button class="btn primary" data-act="submit" data-kind="milestone">Save milestone</button></div></div>';
}
function formEngagement(projects){
 return '<div class="form"><div class="field"><label>Initiative *</label><select id="f_proj">'+projOpts(projects)+'</select></div>'+
 '<div class="row2"><div class="field"><label>Site *</label><select id="f_site"><option value="">Select a site</option>'+optList(SITES)+'</select></div><div class="field"><label>Work area *</label><select id="f_wa"><option value="">Select a work area</option>'+optList(WORK_AREAS)+'</select></div></div>'+
 '<div class="row2"><div class="field"><label>Engagement stage *</label><select id="f_stage"><option value="">Select stage</option>'+optList(ENG_STAGES)+'</select></div><div class="field"><label>Status *</label><select id="f_status"><option value="">Select status</option>'+optList(ENG_STATUS)+'</select></div></div>'+
 '<div class="row2"><div class="field"><label>Start date *</label><input type="date" id="f_start" value="'+todayISO()+'"></div><div class="field"><label>End date *</label><input type="date" id="f_end" value="'+todayISO()+'"></div></div>'+
 '<div class="field"><label>Team</label><input type="text" id="f_team" placeholder="Defaults to the work area team"></div>'+
 '<div class="field"><label>Engagement purpose</label><textarea id="f_purpose" placeholder="Why the engagement is happening"></textarea></div>'+
 '<div><button class="btn primary" data-act="submit" data-kind="engagement">Save engagement</button></div></div>';
}

// ----------------------------- render + events -----------------------------
var VIEWS={home:viewHome,roadmap:viewRoadmap,projects:viewProjects,detail:viewDetail,engagements:viewEngagements,sites:viewSites,updates:viewUpdates};
function navFor(view){return view==="detail"?"projects":view;}
function render(){
 var el=document.getElementById("view");
 el.innerHTML=(VIEWS[state.view]||viewHome)();
 var active=navFor(state.view);
 var items=document.querySelectorAll(".nav-item");
 for(var i=0;i<items.length;i++){items[i].classList.toggle("active",items[i].getAttribute("data-view")===active);}
 document.querySelector(".main").scrollTop=0;
}
function val(id){var e=document.getElementById(id);return e?e.value:"";}

document.addEventListener("click",function(ev){
 var t=ev.target.closest("[data-act]"); if(!t)return;
 var act=t.getAttribute("data-act");
 if(act==="nav"){state.view=t.getAttribute("data-view");state.heatSel="";render();}
 else if(act==="project"){state.projectId=t.getAttribute("data-id");state.detailTab="milestones";state.view="detail";render();}
 else if(act==="site"||act==="selsite"){state.site=t.getAttribute("data-id");state.view="sites";render();}
 else if(act==="tab"){var g=t.getAttribute("data-group"),v=t.getAttribute("data-tab");if(g==="detail")state.detailTab=v;else if(g==="eng"){state.engTab=v;state.heatSel="";}else if(g==="upd"){state.updTab=v;state.flash="";}render();}
 else if(act==="heat"){state.heatSel=(state.heatSel===t.getAttribute("data-cell"))?"":t.getAttribute("data-cell");render();}
 else if(act==="pickinit"){state.eng.initiativeId=t.getAttribute("data-id");render();}
 else if(act==="clear"){var grp=t.getAttribute("data-group");if(grp==="rm")state.rm={portfolio:"",site:"",workArea:"",stage:""};else if(grp==="eng"){state.eng={initiativeId:"",site:"",portfolio:"",workArea:"",status:"",stage:""};state.heatSel="";}render();}
 else if(act==="another"){state.flash="";render();}
 else if(act==="submit"){submitForm(t.getAttribute("data-kind"));}
});
document.addEventListener("change",function(ev){
 var t=ev.target;
 if(t.hasAttribute&&t.hasAttribute("data-fgroup")){var g=t.getAttribute("data-fgroup"),k=t.getAttribute("data-fkey");state[g][k]=t.value;if(g==="eng")state.heatSel="";render();}
});
document.addEventListener("input",function(ev){
 var t=ev.target;
 if(t.hasAttribute&&t.hasAttribute("data-search")){state.pf.q=t.value;var pos=t.selectionStart;render();var ne=document.querySelector('[data-search="pf"]');if(ne){ne.focus();try{ne.setSelectionRange(pos,pos);}catch(e){}}}
});

var idc=2000;
function submitForm(kind){
 var pid=val("f_proj"); if(!pid){alert("Please choose an initiative.");return;}
 if(kind==="project"){
   var sum=val("f_sum").trim(), by=val("f_by").trim(); if(!sum||!by){alert("Summary and submitted-by are required.");return;}
   var u={id:"u-"+(++idc),projectId:pid,date:val("f_date"),summary:sum,risks:val("f_risk").trim()||"None this period.",decisionsRequired:val("f_dec").trim()||"None this period.",submittedBy:by};
   DATA.updates.unshift(u);
   var p=projById(pid);p.lastUpdate=sum;p.lastUpdated=val("f_date");var ns=val("f_status"),ng=val("f_stage");if(ns)p.status=ns;if(ng)p.stage=ng;
   state.flash="Update added to "+p.title+" and its record refreshed"+(ns?" · status now "+ns:"")+".";
 } else if(kind==="milestone"){
   var nm=val("f_name").trim(), st=val("f_status"); if(!nm||!st){alert("Name and status are required.");return;}
   DATA.milestones.push({id:"m-"+(++idc),projectId:pid,name:nm,date:val("f_date"),status:st,notes:val("f_notes").trim()});
   state.flash='Milestone "'+nm+'" added.';
 } else {
   var site=val("f_site"),wa=val("f_wa"),stg=val("f_stage"),est=val("f_status"); if(!site||!wa||!stg||!est){alert("Site, work area, stage and status are required.");return;}
   var pp=projById(pid);
   DATA.engagements.push({id:"g-"+(++idc),initiativeId:pid,portfolio:pp.portfolio,site:site,workArea:wa,team:val("f_team").trim()||(wa+" Team"),stage:stg,status:est,startDate:val("f_start"),endDate:val("f_end"),purpose:val("f_purpose").trim(),notes:""});
   state.flash="Engagement for "+wa+" at "+site+" ("+stg+") added.";
 }
 render();
}

render();

</script>
</body>
</html>
